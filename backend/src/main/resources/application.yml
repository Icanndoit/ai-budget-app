spring:
  datasource:
    url: jdbc:mysql://localhost:3306/budget_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd

jwt:
  secret: your-256-bit-secret-key-change-this-in-production
  expiration: 86400000  # 24시간 (ms)

ai:
  module:
    url: http://localhost:5000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.budget.app: DEBUG
    org.hibernate.SQL: DEBUG
